name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    name: server (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            ext: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: ryns-code-mcp-rs
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          BIN="ryns-code-mcp-rs/target/${{ matrix.target }}/release/ryns-code-mcp${{ matrix.ext }}"
          test -f "$BIN"
          mkdir -p dist/ryns-mcp-server
          cp "$BIN" dist/ryns-mcp-server/
          cp scripts/safety-sidecar/index.mjs \
             scripts/safety-sidecar/package.json \
             scripts/safety-sidecar/package-lock.json \
             scripts/safety-sidecar/README.md \
             dist/ryns-mcp-server/
          tar -czf "dist/ryns-mcp-server-${{ matrix.name }}.tar.gz" -C dist ryns-mcp-server
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.name }}
          path: dist/ryns-mcp-server-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  gui:
    name: gui (macos-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sidecar deps
        working-directory: scripts/safety-sidecar
        run: npm ci --no-audit --no-fund
      - name: Build bundled server
        working-directory: ryns-code-mcp-rs
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build GUI
        working-directory: src-tauri
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Assemble .app
        run: |
          set -euo pipefail
          APP="dist/Ryns Control.app"
          rm -rf dist
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/server"
          VERSION=$(grep -m1 '^version' ryns-code-mcp-rs/Cargo.toml | cut -d'"' -f2)

          ISET="dist/AppIcon.iconset"
          mkdir -p "$ISET"
          for s in 16 32 64 128 256 512; do
            sips -z $s $s src-tauri/icons/icon.png --out "$ISET/icon_${s}x${s}.png" >/dev/null
          done
          sips -z 32 32   src-tauri/icons/icon.png --out "$ISET/icon_16x16@2x.png" >/dev/null
          sips -z 64 64   src-tauri/icons/icon.png --out "$ISET/icon_32x32@2x.png" >/dev/null
          sips -z 256 256 src-tauri/icons/icon.png --out "$ISET/icon_128x128@2x.png" >/dev/null
          sips -z 512 512 src-tauri/icons/icon.png --out "$ISET/icon_256x256@2x.png" >/dev/null
          iconutil -c icns "$ISET" -o "$APP/Contents/Resources/AppIcon.icns"

          cp "src-tauri/target/${{ matrix.target }}/release/ryns-mcp-control" "$APP/Contents/MacOS/ryns-mcp-control"
          cp "ryns-code-mcp-rs/target/${{ matrix.target }}/release/ryns-code-mcp" "$APP/Contents/Resources/server/ryns-code-mcp"
          mkdir -p "$APP/Contents/Resources/server/safety-sidecar"
          cp scripts/safety-sidecar/index.mjs scripts/safety-sidecar/package.json "$APP/Contents/Resources/server/safety-sidecar/"
          cp -R scripts/safety-sidecar/node_modules "$APP/Contents/Resources/server/safety-sidecar/node_modules"

          {
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' \
              '  <key>CFBundleName</key><string>ryns-mcp-control</string>' \
              '  <key>CFBundleDisplayName</key><string>Ryns Control</string>' \
              '  <key>CFBundleIdentifier</key><string>com.ryns.control</string>' \
              '  <key>CFBundleExecutable</key><string>ryns-mcp-control</string>' \
              '  <key>CFBundlePackageType</key><string>APPL</string>' \
              "  <key>CFBundleShortVersionString</key><string>${VERSION}</string>" \
              '  <key>CFBundleIconFile</key><string>AppIcon</string>' \
              '  <key>NSHighResolutionCapable</key><true/>' \
              '  <key>LSMinimumSystemVersion</key><string>10.15</string>' \
              '</dict></plist>'
          } > "$APP/Contents/Info.plist"

          codesign --force -s - "$APP" || true
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/ryns-mcp-control-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: gui-macos-${{ matrix.arch }}
          path: dist/ryns-mcp-control-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [server, gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: ls -la dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "Ryns MCP $TAG" --generate-notes
          fi
